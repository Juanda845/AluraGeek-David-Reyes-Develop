<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/estilos-form.css">
    <link rel="stylesheet" href="../css/flexbox.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>AluraGeek</title>
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
</head>

<body>
    <!-- encabezado -->
    <header>
        <nav class="encabezado">
            <a class="" href="../index.html">
                <i class="fa-solid fa-house fa-2xl"></i></i>
            </a>
        </nav>
    </header>

    <main class="container">
        <form class="container__formulario" data-formulario>
            <h2 class="formulario__titulo">¡Envía un producto!</h2>
            <div class="formulario__campo">
                <label class="campo__etiqueta" for="titulo">Título del producto</label>
                <input name="titulo" class="campo__escrita" required
                    placeholder="En este campo, pon el nombre del producto" id='titulo' data-titulo />
            </div>

            <div class="formulario__campo">
                <label class="campo__etiqueta" for="imagem">Imagen del producto</label>
                <input name="imagem" class="campo__escrita" required placeholder="Inserta la URL de la imagen"
                    id='imagem' data-imagem />
            </div>
            <input class="formulario__boton" type="submit" />
        </form>
    </main>
    <script src="../Js/crearProducto.js" type="module"></script>
</body>

</html>
